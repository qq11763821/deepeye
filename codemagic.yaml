workflows:
  ios-unsigned:
    name: Build unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "DeepEye.xcodeproj"
        XCODE_SCHEME: "DeepEye"
    scripts:
      - name: Install xcodegen
        script: |
          brew install xcodegen || true
          xcodegen --version

      - name: Generate Xcode project
        script: |
          xcodegen generate
          ls -la
          ls -la "$XCODE_PROJECT"

      - name: Build (no signing)
        script: |
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ENABLE_BITCODE=NO \
            ONLY_ACTIVE_ARCH=NO \
            | tee build.log | tail -60

      - name: Verify bundle
        script: |
          APP=build/Build/Products/Release-iphoneos/DeepEye.app
          echo "=== app ==="
          ls -la "$APP"
          echo "=== models ==="
          ls -la "$APP" | grep -i mlmodelc || echo "!!! models missing !!!"
          echo "=== extension ==="
          ls -la "$APP/PlugIns/" || echo "!!! extension missing !!!"

      - name: Package IPA
        script: |
          APP=build/Build/Products/Release-iphoneos/DeepEye.app
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr DeepEye-unsigned.ipa Payload
          ls -lh DeepEye-unsigned.ipa

    artifacts:
      - DeepEye-unsigned.ipa
      - build.log
