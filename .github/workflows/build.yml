name: Build unsigned IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    # macos-13 = Intel x64 标准 runner（免费账号可用）
    # 不要用 macos-14（默认解析成 arm64 XL，免费账号不支持）
    runs-on: macos-13
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          ls -la
          xcodegen generate
          ls -la *.xcodeproj

      - name: Build (no signing)
        run: |
          xcodebuild \
            -project DeepEye.xcodeproj \
            -scheme DeepEye \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ENABLE_BITCODE=NO \
            ONLY_ACTIVE_ARCH=NO \
            | tee build.log | tail -50

      - name: Verify app bundle
        run: |
          APP=build/Build/Products/Release-iphoneos/DeepEye.app
          echo "=== App 内容 ==="
          ls -la "$APP"
          echo "=== 模型是否打包进去 ==="
          ls -la "$APP" | grep -i mlmodelc || echo "!!! 警告：模型没打进去 !!!"
          echo "=== 扩展是否嵌入 ==="
          ls -la "$APP/PlugIns/" || echo "!!! 警告：扩展没嵌入 !!!"

      - name: Package IPA
        run: |
          APP=build/Build/Products/Release-iphoneos/DeepEye.app
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr DeepEye-unsigned.ipa Payload
          ls -lh DeepEye-unsigned.ipa
          unzip -l DeepEye-unsigned.ipa | head -30

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DeepEye-unsigned-ipa
          path: DeepEye-unsigned.ipa
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
